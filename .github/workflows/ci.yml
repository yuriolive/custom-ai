name: CI

# ---------------------------------------------------------------------------
# Triggers.
#
# `push: ["**"]` is what actually runs CI today — the team works on long-lived
# branches (mvp-0-foundation) and pushes directly. `pull_request` is kept so a
# PR opened from a FORK still gets checked, because a fork's pushes never reach
# this repo's push event.
#
# SECURITY — fork PRs and secrets. This repo has no secrets today, so nothing is
# currently exposed. But `pull_request` runs the workflow *definition from the
# base branch* with the *code from the PR head*. The moment anyone adds a deploy
# step, a publish step, or any `secrets.*` reference to a job that runs on
# `pull_request`, a fork PR can exfiltrate that secret by editing the code the
# job executes (a test file, a build script, a postinstall hook — all of it runs
# with the secret in the environment).
#
# The rule, therefore:
#   * jobs in this workflow are BUILD/TEST ONLY and must never reference
#     `secrets.*` beyond the automatic `GITHUB_TOKEN`;
#   * anything that needs a real secret (deploy, publish, `supabase link`,
#     `supabase functions deploy`, Stripe keys, RunPod keys) goes in a SEPARATE
#     job gated on push-to-main, i.e.
#
#       deploy:
#         needs: [node, python, deno, pgtap]
#         if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#         environment: production   # adds a second gate: required reviewers
#
#     `github.event_name == 'push'` is the load-bearing half — a fork cannot
#     produce a push event on this repo, so the job is unreachable from a fork.
#     Never use `pull_request_target` here; it runs base-branch workflow code
#     with write-scoped credentials and is the other half of this exfil path.
# ---------------------------------------------------------------------------
on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege. Every job in this workflow only reads the repo; nothing
# writes checks, comments, packages, or attestations. Declaring it at workflow
# level means a future job cannot silently inherit a write-scoped token — it has
# to ask for the scope explicitly, in its own `permissions:` block, in a diff a
# reviewer will see.
permissions:
  contents: read

# Keyed on head_ref (the PR's source branch) when this is a pull_request, and on
# the ref otherwise. Without the head_ref fallback a PR run and a branch push run
# land in different concurrency groups and neither cancels the other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Supabase CLI telemetry ping — off in CI. Also stops the first-run prompt.
  DO_NOT_TRACK: "1"

jobs:
  node:
    name: node (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same-repo PRs are already covered by the push event on the same commit;
    # without this guard every branch with an open PR runs the whole matrix
    # twice, including the ~10-minute pgtap job. Fork PRs have no push event on
    # this repo, so `head.repo.full_name != github.repository` lets them through.
    # (GitHub counts a skipped job as success for required status checks, so
    # this does not block branch protection.)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # No step here pushes; dropping the token from .git/config keeps it out
          # of reach of anything `npm ci` or a build script might run.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # caches ~/.npm (the download cache), not node_modules

      - name: Install
        run: npm ci

      # Next.js incremental build cache. Without this every CI run recompiles the
      # whole app from cold. Keyed on the lockfile plus sources so a source-only
      # change still restores a warm cache via restore-keys.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      # oxlint first: ~50x faster than eslint, so a broken tree fails in ~1s.
      - name: oxlint
        run: npm run oxlint

      # eslint carries the Next.js/React rules oxlint does not implement, plus the
      # HeroUI v3 guard rules (no onClick, no @heroui/system|theme imports).
      - name: eslint
        run: npm run lint:next

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # Secrets must never reach a NEXT_PUBLIC_* variable.
      - name: check:env
        run: npm run check:env

      # Next inlines NEXT_PUBLIC_* at BUILD time, and the auth module throws on
      # absence — so page-data collection for /auth/callback cannot run without
      # them. These are deliberately fake placeholders: this job verifies that the
      # app COMPILES, it does not produce a deployable artifact. Real values come
      # from the deploy environment, never from here. Anything secret must never
      # appear in this block (see the fork-PR warning in the header).
      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-not-a-real-key
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_ANON_KEY: ci-build-placeholder-not-a-real-key

      # Advisory until the one-time repo-wide `npm run format` lands: adding the
      # formatter and reformatting 20 files in the same change would bury every
      # other diff. Flip continue-on-error off once that commit is in.
      - name: format:check
        run: npm run format:check
        continue-on-error: true

  python:
    name: python (tools/modal)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    # Runs in parallel with the node job. tools/modal holds the capacity solver and
    # the SSE usage analyzer — the code that decides which GPU a model lands on and
    # how many tokens a caller is billed for. It had 41 tests that CI never ran.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: tools/modal/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version-file: tools/modal/pyproject.toml

      # test_measure.py imports only measure.py and tiers.py, both stdlib-only.
      # `modal` is needed solely by app.py, which the tests never import — so the
      # project's `dependencies = []` means the full suite runs with nothing
      # installed. `--locked` fails the build if uv.lock is stale rather than
      # resolving something the lockfile does not pin.
      #
      # test_tier_drift.py is listed EXPLICITLY, not discovered: it reads
      # supabase/migrations and fails if gpu_tiers (the catalog that runs at request
      # time) and tiers.py disagree on hardware or price. It is also stdlib-only —
      # no database, no network, no Modal credential. The credentialed direction
      # (are the committed prices still Modal's published ones?) is
      # tools/modal/sync_rates.py --check, which is local-only by design.
      - name: test
        working-directory: tools/modal
        run: uv run --locked python -m unittest test_measure test_tier_drift -v

      # --no-build: install ruff from its published wheel only. A source
      # distribution would run its build backend, i.e. arbitrary code, in the job.
      - name: ruff check
        working-directory: tools/modal
        run: uv run --locked --no-build --group dev ruff check .

      - name: ruff format --check
        working-directory: tools/modal
        run: uv run --locked --no-build --group dev ruff format --check .

  deno:
    name: deno (edge function gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    # supabase/functions/gateway ships to Supabase Edge Functions, which is Deno.
    # Until now it was only ever executed by node's TS type-stripping (`npm test`,
    # `tsc -p`), which resolves modules differently, has different globals, and
    # cannot see a Deno-only type error at all. deno.json already declares
    # check/lint/fmt tasks; nothing ran them. This job is the fastest in the
    # workflow (~30s incl. install), so it is the cheapest place to fail.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Caches ~/.cache/deno (the module + npm registry cache). setup-deno
          # keys the cache off deno.lock by default; this project has no
          # deno.lock (deno.json declares `"imports": {}` and the gateway has
          # zero remote imports today), so cache-hash supplies the key instead —
          # without it the action has nothing to key on. Close to a no-op now,
          # free insurance the moment a jsr:/npm: specifier appears.
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/gateway/deno.json') }}

      # `deno check` on the runtime sources. Not `deno task check` from deno.json:
      # that task once skipped stream.ts and usage.ts, the two files that do the
      # streaming and the billing. Every runtime file is listed HERE, so a new one
      # is checked because it is named — not because something happens to import
      # it. Test files are excluded on purpose — they run under `node --test` in
      # the node job, not under Deno.
      - name: deno check
        working-directory: supabase/functions/gateway
        run: deno check index.ts auth.ts resolve.ts errors.ts anthropic.ts stream.ts usage.ts

      - name: deno lint
        working-directory: supabase/functions/gateway
        run: deno lint

      # Unpinned: all three steps verified clean under Deno 2.9.5 after the
      # one-time `deno fmt` pass. NOTE the runtime gap — local Deno is 2.9.5 but
      # supabase edge-runtime 1.74.3 targets ~Deno 2.1.4, so these checks are
      # STRICTER than the deploy target. That direction is safe; the reverse
      # would not be.
      - name: deno fmt --check
        working-directory: supabase/functions/gateway
        run: deno fmt --check

  pgtap:
    name: pgtap (201 billing invariants)
    runs-on: ubuntu-latest
    # Generous: the first run on a cold runner pulls supabase/postgres (~1.5 GB),
    # supabase/gotrue and supabase/pg_prove before a single test executes, and
    # 05_concurrency_test.sql deliberately spends wall-clock time on its
    # release barriers. 30 min is a hang detector, not a target (~8-12 min real).
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository

    # These are the highest-value tests in the repo and CI has never run them.
    # They assert I1-I5 from docs/CONTRACTS.md against a real Postgres — the
    # invariants that keep a wallet from going negative and keep GPU work from
    # going unbilled — and they have already caught two P1 concurrency bugs
    # (a self-deadlock, and a settlement path that stranded transactions).
    # They cannot run without a real server: they exercise FOR UPDATE
    # contention, lock ordering, and the deadlock detector.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The CLI comes from the repo's own devDependency, NOT an ad-hoc
      # `npx supabase@<version>`. Three surfaces used to disagree: CI pinned
      # 2.114.0, the developer shell had scoop's 2.54.11, and the repo needed
      # >= 2.115 to parse its own config.toml at all ("'' has invalid keys:
      # local_smtp"). One pin in package.json removes that whole class of drift,
      # and a CLI release can no longer change what "the tests passed" means
      # without showing up in the lockfile diff.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (supabase CLI comes from devDependencies)
        run: npm ci

      # `version` is the PRIMARY KEY of supabase_migrations.schema_migrations, so
      # two migration files sharing a numeric prefix is not a naming nit: the
      # second INSERT raises 23505 and `supabase db reset` aborts partway
      # through, which takes this job — and therefore every open PR — red for a
      # reason that has nothing to do with the PR. It has happened twice
      # (0348c2d moved tool_calling off a collision with gpu_tiers_modal_catalog;
      # it then collided again with api_key_usage_counters one number along),
      # because two branches that never see each other's files cannot detect it
      # themselves. Same script `npm run check` runs, so the collision is caught
      # on the machine that creates it; here it is the backstop, placed before
      # the ~1.5 GB image pull so a third one fails in seconds.
      - name: check:migrations
        run: npm run check:migrations

      # NOTE ON DOCKER LAYER CACHING: deliberately not done. The only image worth
      # caching is supabase/postgres at ~1.5 GB compressed; `docker save` +
      # actions/cache round-trips it through the 10 GB repo cache, and restoring
      # 1.5 GB from the Actions cache is not reliably faster than pulling it from
      # Docker Hub on an Azure-hosted runner — while permanently consuming most of
      # the repo's cache budget and evicting the npm/Next.js caches that DO pay
      # off. Revisit only with measurements from this repo's own runs.
      - name: supabase start
        run: |
          npx supabase start \
            -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor
        # Excludes only services with no schema of their own that any migration,
        # seed, or test touches. gotrue/realtime/storage-api/postgrest/kong stay
        # because the migrations and 05_concurrency_test.sql insert into
        # auth.users, and RLS policies reference auth.uid(). Do not add to this
        # exclusion list without checking `grep -rn 'auth\.\|storage\.' supabase/`.

      # Applies all 21 migrations to a fresh database, then seed.sql
      # ([db.seed] enabled, sql_paths = ["./seed.sql"]). This is also the only
      # thing in CI that proves the migrations still apply cleanly from zero.
      - name: supabase db reset
        run: npx supabase db reset --local

      # The CLI enables pgTAP itself (`create extension if not exists pgtap with
      # schema extensions`), runs supabase/pg_prove:3.36 against the local db, and
      # propagates pg_prove's exit code. No `continue-on-error`, no `|| true` and
      # no `set +e` on any step that asserts something (the trailing `|| true` on
      # the teardown step below is cleanup only, and runs after the verdict is
      # already recorded): a failing invariant must fail the build.
      #
      # 05_concurrency_test.sql creates the `dblink` extension at runtime and fans
      # each scenario out over genuinely separate backends via
      # dblink_connect('host=db port=5432 ...'). `db` is a Docker network alias the
      # CLI assigns to the postgres container (aliases: ["db","db.supabase.internal"]),
      # so the connection is resolved inside the Compose network by the Postgres
      # backend itself — it does not depend on anything about the runner's host
      # networking, and behaves identically in CI and on a developer machine.
      # If dblink were unavailable the file would abort on line 15 rather than
      # quietly degrade to single-connection execution, so a silent false-green
      # on the concurrency scenarios is not a failure mode here.
      - name: supabase test db (pgTAP)
        run: npx supabase test db --local supabase/tests

      # Container logs are the only way to diagnose a failure after the fact:
      # a deadlock-detector abort or an OOM shows up in the postgres log, not in
      # pg_prove's TAP output. `if: failure()` so it costs nothing when green.
      - name: Dump Postgres logs on failure
        if: failure()
        run: docker logs supabase_db_custom-ai --tail 400 || docker ps -a

      - name: supabase stop
        if: always()
        run: npx supabase stop --no-backup || true

  # ===========================================================================
  # NO DEPLOY JOB — deliberately.
  #
  # An earlier revision of this file carried a `deploy-supabase` job (link ->
  # db push -> functions deploy) gated on push-to-main. It has been REMOVED:
  # Supabase's own GitHub integration does the same work, and does it better.
  #
  # The integration, configured in the Supabase dashboard, applies on merge to the
  # configured production branch:
  #   * new migrations
  #   * Edge Functions DECLARED IN config.toml   <- see note below
  #   * Storage buckets declared in config.toml
  # and explicitly IGNORES API config, Auth config, and seed files.
  #
  # Why the integration wins:
  #   * it needs NO GitHub secrets at all (OAuth via the dashboard), so this repo
  #     holds zero deploy credentials instead of three;
  #   * two systems applying migrations to the same database is a race, and the
  #     failure mode is a half-applied schema.
  #
  # IMPORTANT — the `[functions.gateway]` block in supabase/config.toml is what
  # makes the gateway deploy AT ALL. It exists for `verify_jwt = false` (platform
  # API keys are opaque tokens, not JWTs), but the integration only deploys
  # functions that are DECLARED there. Deleting that block would silently stop
  # deploying the gateway, not merely change its auth behaviour.
  #
  # Seed files are ignored by the integration, so the committed fixture API key in
  # supabase/seed.sql cannot reach production through this path. `db reset
  # --linked` remains the way to get that wrong, and it also drops the database.
  # ===========================================================================
